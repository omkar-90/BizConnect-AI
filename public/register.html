<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Marketplace</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS Variables for Easy Theming (Consistent with Login Page) --- */
        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --text-dark: #333;
            --text-light: #fff;
            --error-color: #dc3545;
            --card-bg: #ffffff;
            --shadow-subtle: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        /* --- Global Reset & Typography --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%); /* Soft, appealing background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-dark);
            padding: 20px;
        }

        /* --- Registration Container & Card --- */
        .login-container {
            width: 100%;
            max-width: 450px; /* Slightly wider card for more fields */
        }

        .login-card {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: var(--shadow-subtle);
            text-align: center;
            transition: transform 0.3s ease;
        }
        
        .login-card:hover {
            transform: translateY(-5px); /* Subtle lift effect */
        }

        .login-card h1 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            color: var(--primary-color);
            font-weight: 700;
        }

        /* --- Form Groups, Inputs, and Select --- */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* Style for both input fields and the select dropdown */
        .form-group input,
        .form-group select { 
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 1rem;
            color: var(--text-dark); /* Ensure text color is dark */
            background-color: var(--card-bg);
            transition: border-color 0.3s, box-shadow 0.3s;
            /* Reset for select appearance */
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25); /* Focus ring */
            outline: none;
        }
        
        /* Custom arrow for select to maintain a clean look */
        .select-wrapper {
            position: relative;
        }
        .select-wrapper::after {
            content: '▼'; /* Unicode down arrow */
            position: absolute;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            pointer-events: none; /* Allows clicks to pass through to the select */
            color: #6c757d;
            font-size: 0.8rem;
        }

        /* Apply the wrapper around the select element */
        .form-group select {
            margin-top: 0;
            /* Add padding for the custom arrow */
            padding-right: 30px;
        }

        /* --- Buttons --- */
        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: var(--text-light);
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            margin-top: 10px;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            background-color: #a0c3e7; /* Lighter shade when disabled */
            cursor: not-allowed;
        }

        /* --- Messages & Spinner --- */
        .error-message {
            background-color: #f8d7da;
            color: var(--error-color);
            border: 1px solid var(--error-color);
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            text-align: left;
        }
        
        .loading-spinner {
            padding: 10px;
            color: var(--primary-color);
            font-weight: 600;
        }

        /* --- Footer Link --- */
        .login-card > p { /* Target the direct child paragraph */
            margin-top: 25px;
            font-size: 0.9rem;
            color: #6c757d;
        }
        
        .login-card > p a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .login-card > p a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        /* --- Vendor Shop Information Styles --- */
        #vendorShopInfo {
            border-top: 2px solid #e9ecef;
            padding-top: 20px;
            margin-top: 20px;
        }

        #vendorShopInfo h3 {
            color: var(--primary-color);
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }

        .checkbox-label {
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .checkbox-label:hover {
            background-color: #f8f9fa;
        }

        .checkbox-label input[type="checkbox"] {
            margin: 0;
            width: auto;
        }

        /* File input styling */
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px dashed #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        input[type="file"]:hover {
            border-color: var(--primary-color);
            background-color: #f0f8ff;
        }

        input[type="file"]:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* --- Responsive Design --- */
        @media (max-width: 480px) {
            .login-container {
                padding: 10px;
            }
            
            .login-card {
                padding: 30px 20px;
            }
            
            .login-card h1 {
                font-size: 1.5rem;
            }
        }

    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>Create a New Account</h1>
            <form id="registerForm">
                <div id="errorMessage" class="error-message" style="display:none"></div>

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your full name" />
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com" />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Create a password (min 6 characters)" />
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        required
                        placeholder="Re-enter your password"
                    />
                </div>

                <div class="form-group">
                    <label for="role">Select Role</label>
                    <div class="select-wrapper">
                        <select id="role" name="role" required>
                            <option value="customer" selected>Customer</option>
                            <option value="vendor">Vendor</option>
                            <option value="admin">Admin</option> 
                        </select>
                    </div>
                </div>

                <!-- Vendor Shop Information Section -->
                <div id="vendorShopInfo" style="display: none;">
                    <h3 style="margin: 20px 0 15px 0; color: var(--primary-color); font-size: 1.2rem;">Shop Information</h3>
                    
                    <div class="form-group">
                        <label for="shopName">Shop/Business Name *</label>
                        <input type="text" id="shopName" name="shopName" placeholder="Enter your shop or business name" />
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" />
                    </div>

                    <div class="form-group">
                        <label for="businessType">Business Type *</label>
                        <div class="select-wrapper">
                            <select id="businessType" name="businessType">
                                <option value="">Select Business Type</option>
                                <option value="Electronics Retail">Electronics Retail</option>
                                <option value="Fashion Retail">Fashion Retail</option>
                                <option value="Food & Beverages">Food & Beverages</option>
                                <option value="Home & Garden">Home & Garden</option>
                                <option value="Sports & Recreation">Sports & Recreation</option>
                                <option value="Health & Beauty">Health & Beauty</option>
                                <option value="Books & Stationery">Books & Stationery</option>
                                <option value="Automotive">Automotive</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="address">Business Address *</label>
                        <textarea id="address" name="address" rows="3" placeholder="Enter your complete business address"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="gstNumber">GST Number</label>
                        <input type="text" id="gstNumber" name="gstNumber" placeholder="29ABCDE1234F1Z5" />
                    </div>

                    <div class="form-group">
                        <label for="panNumber">PAN Number</label>
                        <input type="text" id="panNumber" name="panNumber" placeholder="ABCDE1234F" />
                    </div>

                    <div class="form-group">
                        <label for="businessDescription">Business Description</label>
                        <textarea id="businessDescription" name="businessDescription" rows="3" placeholder="Describe your business, products, and services"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="annualTurnover">Annual Turnover (₹)</label>
                        <input type="text" id="annualTurnover" name="annualTurnover" placeholder="e.g., ₹50,00,000" />
                    </div>

                    <div class="form-group">
                        <label for="employeeCount">Number of Employees</label>
                        <input type="text" id="employeeCount" name="employeeCount" placeholder="e.g., 15" />
                    </div>

                    <div class="form-group">
                        <label for="aadharUpload">Aadhar Card Upload *</label>
                        <input type="file" id="aadharUpload" name="aadharUpload" accept=".pdf,.jpg,.jpeg,.png" required />
                        <small style="color: #666; font-size: 0.85rem; margin-top: 5px; display: block;">
                            Upload a clear image or PDF of your Aadhar card (Max 5MB)
                        </small>
                    </div>
                </div>

                <button type="submit" id="registerBtn" class="btn-primary">Register</button>
                <div class="loading-spinner" id="loadingSpinner" style="display:none">Registering...</div>
            </form>
            <p>
                Already have an account? <a href="login.html">Login here</a>
            </p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Wait for DOM to be ready
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Registration page loaded, initializing...');
            
            // Initialize vendor fields visibility and required attributes
            const roleSelect = document.getElementById('role');
            const vendorShopInfo = document.getElementById('vendorShopInfo');
            const aadharUpload = document.getElementById('aadharUpload');
            
            // Set initial state based on default role selection
            if (roleSelect.value === 'vendor') {
                vendorShopInfo.style.display = 'block';
                aadharUpload.setAttribute('required', 'required');
            } else {
                vendorShopInfo.style.display = 'none';
                aadharUpload.removeAttribute('required');
            }
            
            // Show/hide vendor shop information based on role selection
            document.getElementById('role').addEventListener('change', function() {
                const vendorShopInfo = document.getElementById('vendorShopInfo');
                const aadharUpload = document.getElementById('aadharUpload');
                
                if (this.value === 'vendor') {
                    vendorShopInfo.style.display = 'block';
                    // Make Aadhar upload required for vendors
                    aadharUpload.setAttribute('required', 'required');
                } else {
                    vendorShopInfo.style.display = 'none';
                    // Remove required attribute for non-vendors
                    aadharUpload.removeAttribute('required');
                }
            });

            // Image compression function
            function compressImage(file, maxWidth = 800, quality = 0.8) {
                return new Promise((resolve) => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const img = new Image();
                    
                    img.onload = function() {
                        // Calculate new dimensions
                        let { width, height } = img;
                        if (width > maxWidth) {
                            height = (height * maxWidth) / width;
                            width = maxWidth;
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        
                        // Draw and compress
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        canvas.toBlob((blob) => {
                            resolve(blob);
                        }, file.type, quality);
                    };
                    
                    img.src = URL.createObjectURL(file);
                });
            }

            // Register form submission
            console.log('Adding form submission event listener...');
            const form = document.getElementById('registerForm');
            console.log('Form element:', form);
        
            if (form) {
                form.addEventListener('submit', async (e) => {
                    console.log('Form submitted!');
                    e.preventDefault();

                    const errorDiv = document.getElementById('errorMessage');
                    errorDiv.style.display = 'none';

                    const name = document.getElementById('name').value.trim();
                    const email = document.getElementById('email').value.trim();
                    const password = document.getElementById('password').value;
                    const confirmPassword = document.getElementById('confirmPassword').value;
                    const role = document.getElementById('role').value;

                    const registerBtn = document.getElementById('registerBtn');
                    const loadingSpinner = document.getElementById('loadingSpinner');

                    // --- Form Validation ---
                    if (!name || !email || !password || !confirmPassword || !role) {
                        errorDiv.textContent = 'Please fill in all fields.';
                        errorDiv.style.display = 'block';
                        return;
                    }

                    if (password !== confirmPassword) {
                        errorDiv.textContent = 'Passwords do not match.';
                        errorDiv.style.display = 'block';
                        return;
                    }
                    
                    if (password.length < 6) {
                        errorDiv.textContent = 'Password must be at least 6 characters long.';
                        errorDiv.style.display = 'block';
                        return;
                    }

                    // Vendor-specific validation
                    if (role === 'vendor') {
                        const shopName = document.getElementById('shopName').value.trim();
                        const phone = document.getElementById('phone').value.trim();
                        const businessType = document.getElementById('businessType').value;
                        const address = document.getElementById('address').value.trim();
                        const aadharFile = document.getElementById('aadharUpload').files[0];

                        if (!shopName || !phone || !businessType || !address) {
                            errorDiv.textContent = 'Please fill in all required shop information fields.';
                            errorDiv.style.display = 'block';
                            return;
                        }

                        // Temporarily make Aadhar upload optional for testing
                        // if (!aadharFile) {
                        //     errorDiv.textContent = 'Please upload your Aadhar card.';
                        //     errorDiv.style.display = 'block';
                        //     return;
                        // }

                        // Validate file size (5MB max) - only if file exists
                        if (aadharFile && aadharFile.size > 5 * 1024 * 1024) {
                            errorDiv.textContent = 'Aadhar file size must be less than 5MB.';
                            errorDiv.style.display = 'block';
                            return;
                        }

                        // Validate file type - only if file exists
                        if (aadharFile) {
                            const allowedTypes = ['image/jpeg', 'image/jpg', 'image/png', 'application/pdf'];
                            if (!allowedTypes.includes(aadharFile.type)) {
                                errorDiv.textContent = 'Please upload a valid image (JPG, PNG) or PDF file.';
                                errorDiv.style.display = 'block';
                                return;
                            }
                        }
                    }

                    try {
                        registerBtn.disabled = true;
                        loadingSpinner.style.display = 'block';

                        // Prepare registration data
                        const registrationData = {
                            name,
                            email,
                            password,
                            role
                        };

                        // Add shop information for vendors
                        if (role === 'vendor') {
                            const aadharFile = document.getElementById('aadharUpload').files[0];
                            
                            // Only process file if it exists
                            if (aadharFile) {
                                // Compress image if it's an image file
                                let processedFile = aadharFile;
                                if (aadharFile.type.startsWith('image/')) {
                                    loadingSpinner.textContent = 'Processing Aadhar file...';
                                    processedFile = await compressImage(aadharFile);
                                }
                                
                                // Convert file to base64 for storage
                                const fileReader = new FileReader();
                                fileReader.onload = async function(e) {
                                    const aadharBase64 = e.target.result;
                                    
                                    registrationData.shopInfo = {
                                        shopName: document.getElementById('shopName').value.trim(),
                                        phone: document.getElementById('phone').value.trim(),
                                        businessType: document.getElementById('businessType').value,
                                        address: document.getElementById('address').value.trim(),
                                        gstNumber: document.getElementById('gstNumber').value.trim(),
                                        panNumber: document.getElementById('panNumber').value.trim(),
                                        businessDescription: document.getElementById('businessDescription').value.trim(),
                                        annualTurnover: document.getElementById('annualTurnover').value.trim(),
                                        employeeCount: document.getElementById('employeeCount').value.trim(),
                                        aadharFile: {
                                            name: processedFile.name || aadharFile.name,
                                            type: processedFile.type || aadharFile.type,
                                            size: processedFile.size,
                                            data: aadharBase64
                                        }
                                    };

                                    // Proceed with registration
                                    await Auth.register(registrationData);
                                    
                                    // Success message
                                    errorDiv.style.backgroundColor = '#d4edda';
                                    errorDiv.style.color = '#155724';
                                    errorDiv.style.border = '1px solid #c3e6cb';
                                    
                                    if (role === 'vendor') {
                                        errorDiv.textContent = 'Vendor registration submitted for approval! You will be notified once approved.';
                                    } else {
                                        errorDiv.textContent = 'Registration successful! Redirecting to login...';
                                    }
                                    
                                    errorDiv.style.display = 'block';
                                    
                                    // Redirect after 2 seconds
                                    setTimeout(() => {
                                        window.location.href = 'login.html';
                                    }, 2000);
                                };
                                
                                fileReader.onerror = function() {
                                    registerBtn.disabled = false;
                                    loadingSpinner.style.display = 'none';
                                    errorDiv.textContent = 'Error processing Aadhar file. Please try again.';
                                    errorDiv.style.display = 'block';
                                };
                                
                                fileReader.readAsDataURL(processedFile);
                                return; // Exit early, registration will continue in the file reader callback
                            } else {
                                // No file uploaded, proceed without file
                                registrationData.shopInfo = {
                                    shopName: document.getElementById('shopName').value.trim(),
                                    phone: document.getElementById('phone').value.trim(),
                                    businessType: document.getElementById('businessType').value,
                                    address: document.getElementById('address').value.trim(),
                                    gstNumber: document.getElementById('gstNumber').value.trim(),
                                    panNumber: document.getElementById('panNumber').value.trim(),
                                    businessDescription: document.getElementById('businessDescription').value.trim(),
                                    annualTurnover: document.getElementById('annualTurnover').value.trim(),
                                    employeeCount: document.getElementById('employeeCount').value.trim()
                                };
                                
                                // Proceed with registration
                                await Auth.register(registrationData);
                                
                                // Success message
                                errorDiv.style.backgroundColor = '#d4edda';
                                errorDiv.style.color = '#155724';
                                errorDiv.style.border = '1px solid #c3e6cb';
                                errorDiv.textContent = 'Vendor registration submitted for approval! You will be notified once approved.';
                                errorDiv.style.display = 'block';
                                
                                // Redirect after 2 seconds
                                setTimeout(() => {
                                    window.location.href = 'login.html';
                                }, 2000);
                                return;
                            }
                        }

                        // Real API call to register user
                        await Auth.register(registrationData);
                        
                        // Success message
                        errorDiv.style.backgroundColor = '#d4edda';
                        errorDiv.style.color = '#155724';
                        errorDiv.style.border = '1px solid #c3e6cb';
                        
                        if (role === 'vendor') {
                            errorDiv.textContent = 'Vendor registration submitted for approval! You will be notified once approved.';
                        } else {
                            errorDiv.textContent = 'Registration successful! Redirecting...';
                        }
                        errorDiv.style.display = 'block';
                        
                        // Redirect to appropriate dashboard
                        setTimeout(() => {
                            Auth.redirectToDashboard();
                        }, 2000);
                
                    } catch (err) {
                        errorDiv.style.backgroundColor = '#f8d7da';
                        errorDiv.style.color = 'var(--error-color)';
                        errorDiv.style.border = '1px solid var(--error-color)';
                        errorDiv.textContent = err.message || 'Registration failed. Please try again.';
                        errorDiv.style.display = 'block';
                    } finally {
                        registerBtn.disabled = false;
                        loadingSpinner.style.display = 'none';
                    }
                });
            } else {
                console.error('Form element not found!');
            }
        
        }); // End of DOMContentLoaded
    </script>
</body>
<script src="/js/chatbot.js"></script>
</html>
